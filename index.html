<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financial Tracker</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <h1>💰 Financial Tracker</h1>
      <p class="subtitle">Track your income &amp; expenses</p>
    </header>

    <!-- Summary Cards -->
    <section class="summary">
      <div class="card card--balance">
        <span class="card__label">Balance</span>
        <span class="card__amount" id="balance">$0.00</span>
      </div>
      <div class="card card--income">
        <span class="card__label">Total Income</span>
        <span class="card__amount" id="total-income">$0.00</span>
      </div>
      <div class="card card--expense">
        <span class="card__label">Total Expenses</span>
        <span class="card__amount" id="total-expenses">$0.00</span>
      </div>
    </section>

    <!-- Monthly Budget -->
    <section class="budget-section">
      <div class="budget-card" id="budget-card">
        <div class="budget-top">
          <div class="budget-title-group">
            <span class="budget-title">Monthly Budget</span>
            <span class="budget-month" id="budget-month"></span>
          </div>
          <div class="budget-set">
            <label for="budget-input" class="budget-set-label">Budget:</label>
            <div class="budget-input-wrap">
              <span class="budget-symbol">$</span>
              <input type="number" id="budget-input" class="budget-input" placeholder="0.00" min="0" step="0.01" />
            </div>
          </div>
        </div>
        <div class="budget-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Monthly budget used">
          <div class="budget-fill" id="budget-fill"></div>
        </div>
        <div class="budget-meta" id="budget-meta"></div>
      </div>
    </section>

    <!-- Main Content -->
    <main class="main">
      <!-- Left: Add Transaction Form -->
      <section class="panel form-panel">
        <h2>Add Transaction</h2>
        <form id="transaction-form">
          <!-- Type Toggle -->
          <div class="toggle-group">
            <button type="button" class="toggle-btn active" data-type="income" aria-pressed="true">Income</button>
            <button type="button" class="toggle-btn" data-type="expense" aria-pressed="false">Expense</button>
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="e.g. Monthly salary" autocomplete="off" required />
          </div>

          <div class="form-group">
            <label for="amount">Amount ($)</label>
            <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" autocomplete="off" required />
          </div>

          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <!-- Options populated by JS based on type -->
            </select>
          </div>

          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required />
          </div>

          <button type="submit" class="btn-submit" id="submit-btn">Add Income</button>
        </form>
      </section>

      <!-- Right: Chart -->
      <section class="panel chart-panel">
        <h2>Spending by Category</h2>
        <div class="chart-container">
          <canvas id="category-chart" role="img" aria-label="Spending by category doughnut chart"></canvas>
          <p class="chart-empty" id="chart-empty">No expense data yet. Add some transactions!</p>
        </div>
      </section>
    </main>

    <!-- Transaction History -->
    <section class="panel history-panel">
      <div class="history-header">
        <h2>Transaction History</h2>
        <div class="filter-group">
          <select id="filter-type" aria-label="Filter by type">
            <option value="all">All</option>
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
          <select id="filter-category" aria-label="Filter by category">
            <option value="all">All Categories</option>
          </select>
        </div>
      </div>
      <div class="table-wrapper">
        <table class="history-table">
          <thead>
            <tr>
              <th scope="col">Date</th>
              <th scope="col">Description</th>
              <th scope="col">Category</th>
              <th scope="col">Amount</th>
              <th scope="col" aria-label="Actions"></th>
            </tr>
          </thead>
          <tbody id="history-body">
            <!-- Rows injected by JS -->
          </tbody>
        </table>
        <p class="history-empty" id="history-empty">No transactions yet.</p>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
